<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Foundations Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-line:#DCD5C0;
    --ink:#2A2A2E;
    --ink-soft:#5B584F;
    --indigo:#33459B;
    --indigo-soft:#E7E9F5;
    --amber:#D98E2B;
    --amber-soft:#FBEBD3;
    --coral:#B5533C;
    --coral-soft:#F6E4DE;
    --green:#4C7A55;
    --green-soft:#E4EEE3;
    --margin:56px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px),
      var(--paper);
    min-height:100vh;
  }
  .page{
    max-width:820px;
    margin:0 auto;
    padding:40px var(--margin) 80px var(--margin);
    position:relative;
    min-height:100vh;
  }
  .page::before{
    content:"";
    position:absolute;
    top:0; bottom:0;
    left:34px;
    width:2px;
    background:var(--coral);
    opacity:0.55;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--indigo);
    margin-bottom:6px;
    display:block;
  }
  .title{font-size:30px; font-weight:700; color:var(--ink);}
  .subtitle{color:var(--ink-soft); font-size:15px; margin-top:8px; line-height:1.55; max-width:60ch;}
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:22px 24px;
    margin-top:18px;
    box-shadow:0 1px 2px rgba(42,42,46,0.04);
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:11px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--indigo); color:#fff;}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(51,69,155,0.28);}
  .btn-primary:disabled{background:#b9bdd6; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--paper-line);}
  .btn-ghost:hover{border-color:var(--indigo); color:var(--indigo);}
  .btn-danger{background:var(--coral-soft); color:var(--coral);}
  input[type=text], input[type=number], textarea{
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:9px 12px;
    border-radius:7px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    color:var(--ink);
    width:100%;
    outline:none;
  }
  input:focus, textarea:focus{border-color:var(--indigo);}
  textarea{resize:vertical; min-height:52px; font-family:'Inter',sans-serif;}
  .name-row{display:flex; gap:10px; margin-top:18px; max-width:420px;}
  .name-row input{flex:1;}

  /* Number-line progress (signature element) */
  .numberline-wrap{margin:26px 0 8px 0;}
  .numberline{
    position:relative;
    height:10px;
    border-radius:6px;
    background:#EFEAD9;
    overflow:visible;
  }
  .numberline-seg{position:absolute; top:0; bottom:0;}
  .numberline-marker{
    position:absolute;
    top:-9px;
    width:26px; height:26px;
    margin-left:-13px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    background:var(--amber);
    border-radius:50%;
    border:3px solid var(--paper);
    box-shadow:0 2px 6px rgba(0,0,0,0.18);
    transition:left .35s ease;
  }
  .numberline-ticks{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;}

  .part-tabs{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .part-tab{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    background:var(--indigo-soft);
    color:var(--indigo);
    display:flex; align-items:center; gap:6px;
  }
  .part-tab.locked{background:var(--green-soft); color:var(--green);}
  .part-tab.current{outline:2px solid var(--indigo);}

  .q{
    padding:16px 0;
    border-bottom:1px dashed var(--paper-line);
  }
  .q:last-child{border-bottom:none;}
  .q-num{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--indigo);
    margin-right:8px;
  }
  .q-prompt{font-size:15px; line-height:1.5;}
  .q-input-wrap{margin-top:10px; max-width:420px;}
  .tf-row{display:flex; gap:18px; margin-top:10px;}
  .tf-opt{display:flex; align-items:center; gap:6px; font-size:14.5px; cursor:pointer;}
  .cb-row{display:flex; gap:20px; margin-top:10px; flex-wrap:wrap;}
  .cb-opt{display:flex; align-items:center; gap:6px; font-size:14.5px; cursor:pointer;}
  .manual-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--amber);
    background:var(--amber-soft);
    padding:2px 7px;
    border-radius:5px;
    margin-left:8px;
    letter-spacing:0.03em;
  }

  .footer-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px;
  }
  .timer{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .notice{
    background:var(--amber-soft);
    border:1px solid #EBD5A8;
    color:#7A5314;
    padding:12px 14px;
    border-radius:8px;
    font-size:13.5px;
    margin-top:16px;
    line-height:1.5;
  }
  .student-list{margin-top:22px;}
  .student-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    margin-bottom:8px;
    background:#fff;
  }
  .status-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:3px 9px;
    border-radius:12px;
  }
  .status-inprogress{background:var(--amber-soft); color:#7A5314;}
  .status-submitted{background:var(--green-soft); color:var(--green);}
  .reviewer-link{
    margin-top:40px;
    font-size:12.5px;
    color:var(--ink-soft);

  }
  .reviewer-link a{color:var(--indigo); cursor:pointer; text-decoration:underline;}
  .review-summary{display:flex; gap:14px; flex-wrap:wrap; margin-top:16px;}
  .stat-box{
    background:#fff; border:1px solid var(--paper-line); border-radius:8px;
    padding:12px 16px; min-width:130px;
  }
  .stat-box .num{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--indigo);}
  .stat-box .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .pass-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; padding:4px 10px; border-radius:12px; font-weight:700;
  }
  .pass-yes{background:var(--green-soft); color:var(--green);}
  .pass-no{background:var(--coral-soft); color:var(--coral);}
  .review-q{
    display:flex; justify-content:space-between; gap:14px;
    padding:10px 0; border-bottom:1px dashed var(--paper-line);
    font-size:13.5px;
  }

  .mark-btns{display:flex; gap:6px;}
  .mark-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    padding:4px 9px; border-radius:6px; border:1px solid var(--paper-line);
    background:#fff; cursor:pointer;
  }

  .mark-btn.active-wrong{background:var(--coral-soft); border-color:var(--coral); color:var(--coral);}
  .back-link{font-size:13px; color:var(--indigo); cursor:pointer; display:inline-block; margin-bottom:10px;}

  @media (max-width:600px){
    :root{ --margin:20px; }
    .page::before{ left:10px; }
    .title{ font-size:24px; }
    .card{ padding:16px 16px; }
    .name-row{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
/* ============================================================
   STORAGE — plain browser localStorage, works standalone on
   any device/browser (phones included), no Claude session needed.
   Progress is per-device; getting answers to the reviewer across
   different devices still goes through the download/import file.
   ============================================================ */
const LS_PREFIX = "g1exam:";
window.storage = {
  get: async (key)=>{
    const v = localStorage.getItem(LS_PREFIX+key);
    if(v===null) throw new Error("not found");
    return {key, value: v};
  },
  set: async (key, value)=>{
    localStorage.setItem(LS_PREFIX+key, value);
    return {key, value};
  },
  delete: async (key)=>{
    const existed = localStorage.getItem(LS_PREFIX+key) !== null;
    localStorage.removeItem(LS_PREFIX+key);
    return {key, deleted: existed};
  },
  list: async (prefix)=>{
    const pre = prefix || "";
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LS_PREFIX)===0){
        const stripped = k.slice(LS_PREFIX.length);
        if(stripped.indexOf(pre)===0) keys.push(stripped);
      }
    }
    return {keys};
  }
};

/* ============================================================
   DATA — all 78 questions across 4 parts
   type: 'short' (text match against accept[] after normalize)
         'range' (numeric between range[0]-range[1])
         'tf'    (true/false)
         'checkbox' (multi-select, correctIdx[])
         'manual' (free text, reviewer grades manually)
   ============================================================ */
const PARTS = [
{
  id:0, title:"Part 1 — Foundations Check", sub:"8 questions",
  questions:[
    {n:1, prompt:"Name this shape: 4 sides, opposite sides equal (not all 4 equal), and 4 right angles.", type:"short", accept:["rectangle"]},
    {n:2, prompt:"It's 6:45. What time will it be in 30 minutes?", type:"short", accept:["7:15"]},
    {n:3, prompt:"A cake is cut into 4 equal pieces. Two pieces are eaten. What fraction of the cake is left?", type:"short", accept:["1/2","2/4"]},
    {n:4, prompt:"8 + 5 + 2 =", type:"short", accept:["15"]},
    {n:5, prompt:"17 − 9 =", type:"short", accept:["8"]},
    {n:6, prompt:"In the number 68, what is the actual VALUE of the digit in the tens place (not just \"6\" — the value it represents)?", type:"short", accept:["60"]},
    {n:7, prompt:"Order from greatest to least: 39, 93, 9, 30", type:"short", accept:["93,39,30,9"]},
    {n:8, prompt:"A fruit bowl has 6 apples, 4 bananas, and 10 grapes. How many pieces of fruit in total?", type:"short", accept:["20"]}
  ]
},
{
  id:1, title:"Part 2 — Numbers & Place Value", sub:"9 questions",
  questions:[
    {n:1, prompt:"An array has 4 rows of 6. How many in total?", type:"short", accept:["24"]},
    {n:2, prompt:"Write a subtraction fact that undoes 9 + 7 = 16.", type:"short", accept:["16-7=9","16-9=7"]},
    {n:3, prompt:"A classroom collected cans in three batches: 8, then 9, then 5 more. How many cans total?", type:"short", accept:["22"]},
    {n:4, prompt:"15 − ___ = 6", type:"short", accept:["9"]},
    {n:5, prompt:"Write the number that has 3 hundreds, 9 tens, and 4 ones.", type:"short", accept:["394"]},
    {n:6, prompt:"In the number 706, why does the 0 matter? What does it tell you about the tens place?", type:"manual", expected:"It's a placeholder — it means there are 0 tens (not the same as just \"76\")."},
    {n:7, prompt:"Use the digits 5, 0, and 8 to write the smallest possible 3-digit number.", type:"short", accept:["508"]},
    {n:8, prompt:"Is 217 closer to 200 or to 300?", type:"short", accept:["200"]},
    {n:9, prompt:"Skip count by 100s starting at 250: 250, 350, ___, ___", type:"short", accept:["450,550"]}
  ]
},
{
  id:2, title:"Part 3 — Addition & Subtraction", sub:"9 questions",
  questions:[
    {n:1, prompt:"68 + 47 =", type:"short", accept:["115"]},
    {n:2, prompt:"100 − 37 =", type:"short", accept:["63"]},
    {n:3, prompt:"A jar had 84 marbles. 27 were removed, then 15 were added back. How many now?", type:"short", accept:["72"]},
    {n:4, prompt:"Break apart to add: 56 + 38 = (50+6) + (30+8) =", type:"short", accept:["94"]},
    {n:5, prompt:"90 − ___ = 54", type:"short", accept:["36"]},
    {n:6, prompt:"467 + 258 =", type:"short", accept:["725"]},
    {n:7, prompt:"800 − 346 =", type:"short", accept:["454"]},
    {n:8, prompt:"Start with 345. Add 100, then subtract 10. What do you end with?", type:"short", accept:["435"]},
    {n:9, prompt:"A store had 512 items. They received 275 more, then sold 180. How many items now?", type:"short", accept:["607"]}
  ]
},
{
  id:3, title:"Part 4 — Money, Time & Measurement", sub:"9 questions",
  questions:[
    {n:1, prompt:"You have 3 quarters, 1 dime, and 2 nickels. How much money in total (in cents)?", type:"short", accept:["95"]},
    {n:2, prompt:"A sandwich costs 65 cents. You pay with 3 quarters (75 cents). How much change do you get?", type:"short", accept:["10"]},
    {n:3, prompt:"It's 9:50. What time will it be in 20 minutes?", type:"short", accept:["10:10"]},
    {n:4, prompt:"Which is worth more: 7 dimes, or 3 quarters and 1 nickel? Answer with the cent amount of the larger one.", type:"short", accept:["80"]},
    {n:5, prompt:"It's 12:40 now. A movie starts at 1:15. How many minutes until it starts?", type:"short", accept:["35"]},
    {n:6, prompt:"One hallway is 18 feet long, another is 24 feet long. Combined length?", type:"short", accept:["42"]},
    {n:7, prompt:"Which is the better estimate for the height of a real door: 7 feet or 7 inches?", type:"short", accept:["feet","7feet"]},
    {n:8, prompt:"A ribbon is 2 meters long. How many centimeters is that? (1 m = 100 cm)", type:"short", accept:["200"]},
    {n:9, prompt:"A board is 6 feet long and is cut into 2 equal pieces. How long is each piece?", type:"short", accept:["3"]}
  ]
},
{
  id:4, title:"Part 5 — Data & Geometry", sub:"8 questions",
  questions:[
    {n:1, prompt:"Picture graph: each star = 5 points. A row shows 3 stars. How many points is that?", type:"short", accept:["15"]},
    {n:2, prompt:"Same graph: another row shows 2 stars (10 points). How many more points does the first row (15) have?", type:"short", accept:["5"]},
    {n:3, prompt:"Line plot of shoe sizes: size 3 appears once, size 4 appears four times, size 5 appears twice. Which size is most common?", type:"short", accept:["4"]},
    {n:4, prompt:"Same line plot: how many pairs of shoes are there in total?", type:"short", accept:["7"]},
    {n:5, prompt:"A shape has 4 equal sides and 4 right angles. Is it definitely a square, or could it be some other shape?", type:"short", accept:["square"]},
    {n:6, prompt:"How many more sides does a hexagon have than a triangle?", type:"short", accept:["3"]},
    {n:7, prompt:"A circle is split into 3 equal parts. What is each part called?", type:"short", accept:["third"]},
    {n:8, prompt:"A rectangle is split into 4 parts, but they aren't all the same size. Can each piece correctly be called \"a fourth\"? Why or why not?", type:"manual", expected:"No — a fourth means one of four EQUAL parts."}
  ]
},
{
  id:5, title:"Part 6 — Mixed Challenge Round", sub:"7 questions, no section labels", diagnostic:true,
  note:"Pulled from everything above, in no particular order — just like a real cumulative exam.",
  questions:[
    {n:1, prompt:"A ranch has 245 sheep and 178 cows. How many animals in total?", type:"short", accept:["423"]},
    {n:2, prompt:"Fill in the missing part: 300 + ___ + 6 = 386", type:"short", accept:["80"]},
    {n:3, prompt:"It's 11:40. What time will it be in 50 minutes?", type:"short", accept:["12:30"]},
    {n:4, prompt:"Three matching windows, each 3 feet wide, are placed side by side with no gaps. How wide is the total?", type:"short", accept:["9"]},
    {n:5, prompt:"A rectangle's length is 9 inches and its width is 4 inches. What's the difference between length and width?", type:"short", accept:["5"]},
    {n:6, prompt:"Skip count by 10s starting at 465: 465, 475, ___, ___", type:"short", accept:["485,495"]},
    {n:7, prompt:"Leah has 6 dimes and 4 pennies. She spends 34 cents on candy. How much does she have left (in cents)?", type:"short", accept:["30"]}
  ]
}
];
const TOTAL_QUESTIONS = PARTS.reduce((s,p)=>s+p.questions.length,0);
const PART_PASS_PCT = 0.70;
const OVERALL_PASS_PCT = 0.80;

/* ============================================================
   STATE
   ============================================================ */
let state = {
  screen:"landing",       // landing | exam | submitted | review-login | review
  studentName:"",
  currentPart:0,          // index into PARTS
  answers:{},             // { "1-1": "85,86,89", ... }
  partLocked:[false,false,false,false],
  startTime:null,
  timerHandle:null,
  elapsed:0,
  existingStudents:[],
  reviewSubmissions:[]
};

function qKey(partId, n){ return partId+"-"+n; }
function normalize(s){
  return (s||"").toString().toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9,\/\.\-<>=]/g,"");
}

/* ============================================================
   STORAGE HELPERS
   ============================================================ */
async function saveProgress(){
  const payload = {
    studentName: state.studentName,
    answers: state.answers,
    partLocked: state.partLocked,
    currentPart: state.currentPart,
    elapsed: state.elapsed,
    updatedAt: Date.now()
  };
  try{ await window.storage.set("examProgress:"+state.studentName.toLowerCase(), JSON.stringify(payload), false); }
  catch(e){ console.error("save progress failed", e); }
}
async function loadProgress(name){
  try{
    const res = await window.storage.get("examProgress:"+name.toLowerCase(), false);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function submitExam(){
  const graded = gradeAll();
  const payload = {
    studentName: state.studentName,
    answers: state.answers,
    autoGraded: graded,
    adminReview:{},           // filled in later by reviewer for 'manual' questions
    elapsed: state.elapsed,
    submittedAt: Date.now()
  };
  await window.storage.set("examSubmission:"+state.studentName.toLowerCase(), JSON.stringify(payload), false);
  try{ await window.storage.delete("examProgress:"+state.studentName.toLowerCase(), false); }catch(e){}
}
async function listStudents(){
  const students = {};
  try{
    const prog = await window.storage.list("examProgress:", false);
    (prog && prog.keys ? prog.keys : []).forEach(k=>{
      const name = k.replace("examProgress:","");
      students[name] = students[name] || {}; students[name].inProgress = true;
    });
  }catch(e){}
  try{
    const sub = await window.storage.list("examSubmission:", false);
    (sub && sub.keys ? sub.keys : []).forEach(k=>{
      const name = k.replace("examSubmission:","");
      students[name] = students[name] || {}; students[name].submitted = true;
    });
  }catch(e){}
  return students;
}

/* ============================================================
   GRADING
   ============================================================ */
function gradeQuestion(part, q){
  const key = qKey(part.id, q.n);
  const raw = state.answers[key] || "";
  if(q.type==="short"){
    const norm = normalize(raw);
    const ok = q.accept.some(a=>normalize(a)===norm) && norm.length>0;
    return {type:"auto", correct:ok, blank: raw.trim().length===0};
  }
  if(q.type==="range"){
    const val = parseInt(raw,10);
    const ok = !isNaN(val) && val>=q.range[0] && val<=q.range[1];
    return {type:"auto", correct:ok, blank: raw.toString().trim().length===0};
  }
  if(q.type==="tf"){
    const ok = (raw==="true") === q.correct;
    return {type:"auto", correct: raw!=="" && ok, blank: raw===""};
  }
  if(q.type==="checkbox"){
    return {type:"auto", correct:false, blank:true}; // not used currently
  }
  if(q.type==="manual"){
    return {type:"manual", correct:null, blank: raw.trim().length===0};
  }
}
function gradeAll(){
  const out = {};
  PARTS.forEach(part=>{
    part.questions.forEach(q=>{
      out[qKey(part.id,q.n)] = gradeQuestion(part,q);
    });
  });
  return out;
}
function partScore(part, gradedMap, adminReview){
  let correct=0, total=part.questions.length, manualPending=0;
  part.questions.forEach(q=>{
    const key = qKey(part.id,q.n);
    const g = gradedMap[key];
    if(g.type==="auto"){ if(g.correct) correct++; }
    else{
      const rev = adminReview ? adminReview[key] : undefined;
      if(rev==="correct") correct++;
      else if(rev===undefined) manualPending++;
    }
  });
  return {correct, total, manualPending};
}

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");

function render(){
  if(state.screen==="landing") return renderLanding();
  if(state.screen==="exam") return renderExam();
  if(state.screen==="submitted") return renderSubmitted();
  if(state.screen==="review-login") return renderReviewLogin();
  if(state.screen==="review") return renderReview();
}

async function renderLanding(){
  const students = await listStudents();
  const rows = Object.keys(students).map(name=>{
    const s = students[name];
    const chip = s.submitted ? '<span class="status-chip status-submitted">submitted</span>' : '<span class="status-chip status-inprogress">in progress</span>';
    return `<div class="student-row">
      <div style="font-weight:600;text-transform:capitalize;">${name}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${chip}
        ${!s.submitted ? `<button class="btn btn-ghost" data-resume="${name}">Continue</button>` : ''}
        <button class="btn btn-ghost" data-remove="${name}" title="Remove this entry" style="color:var(--coral);">Remove</button>
      </div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <span class="eyebrow">Math · Cumulative Exam</span>
    <h1 class="title">Ready when you are</h1>
    <p class="subtitle">Starts with a foundations check, moves through a few focused sections, and ends with a mixed challenge round pulling from everything. ${TOTAL_QUESTIONS} questions in total, split into 6 parts you can spread across as many sittings as you want — answers save automatically on this device.</p>

    <div class="card">
      <h3 style="font-size:16px;">Who's taking the exam?</h3>
      <div class="name-row">
        <input type="text" id="nameInput" placeholder="Type your name">
        <button class="btn btn-primary" id="beginBtn">Begin</button>
      </div>
    </div>

    ${rows ? `<div class="student-list"><h3 style="font-size:15px;color:var(--ink-soft);font-weight:600;">Previous students</h3>${rows}</div>` : ''}

    <div class="reviewer-link">Reviewing results? <a id="reviewerLink">Open reviewer view</a></div>
  `;

  document.getElementById("beginBtn").onclick = ()=>startExam(document.getElementById("nameInput").value.trim());
  document.getElementById("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") startExam(e.target.value.trim()); });
  document.querySelectorAll("[data-resume]").forEach(btn=>{
    btn.onclick = ()=>startExam(btn.getAttribute("data-resume"), true);
  });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.onclick = async ()=>{
      const name = btn.getAttribute("data-remove");
      const ok = confirm(`Remove "${name}"'s entry? This deletes any saved progress or submitted answers for this name on this device.`);
      if(!ok) return;
      try{ await window.storage.delete("examProgress:"+name.toLowerCase()); }catch(e){}
      try{ await window.storage.delete("examSubmission:"+name.toLowerCase()); }catch(e){}
      render();
    };
  });
  document.getElementById("reviewerLink").onclick = ()=>{ state.screen="review-login"; render(); };
}

async function startExam(name, isResume){
  if(!name) return;
  state.studentName = name;
  const existing = await loadProgress(name);
  if(existing){
    state.answers = existing.answers || {};
    state.partLocked = existing.partLocked || [false,false,false,false];
    state.currentPart = existing.currentPart || 0;
    state.elapsed = existing.elapsed || 0;
  } else {
    state.answers = {};
    state.partLocked = [false,false,false,false];
    state.currentPart = 0;
    state.elapsed = 0;
  }
  state.screen = "exam";
  startTimer();
  render();
}

function startTimer(){
  if(state.timerHandle) clearInterval(state.timerHandle);
  const tickStart = Date.now();
  const base = state.elapsed;
  state.timerHandle = setInterval(()=>{
    state.elapsed = base + Math.floor((Date.now()-tickStart)/1000);
    const el = document.getElementById("timerDisplay");
    if(el) el.textContent = formatTime(state.elapsed);
  },1000);
}
function formatTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

function answeredCount(){
  let n=0;
  PARTS.forEach(part=>{
    part.questions.forEach(q=>{
      const v = state.answers[qKey(part.id,q.n)];
      if(v!==undefined && v.toString().trim().length>0) n++;
    });
  });
  return n;
}

function renderExam(){
  const part = PARTS[state.currentPart];
  const answered = answeredCount();
  const pct = Math.min(100, (answered/TOTAL_QUESTIONS)*100);

  // number line segment boundaries
  const segColors = ["var(--indigo)","var(--amber)","var(--green)","var(--coral)","var(--indigo)","var(--amber)","var(--green)","var(--coral)","var(--indigo)","var(--amber)"];
  let cum=0;
  const segs = PARTS.map((p,i)=>{
    const startPct = (cum/TOTAL_QUESTIONS)*100;
    cum += p.questions.length;
    const widthPct = (p.questions.length/TOTAL_QUESTIONS)*100;
    return `<div class="numberline-seg" style="left:${startPct}%;width:${widthPct}%;background:${segColors[i]};opacity:0.18;border-radius:6px;"></div>`;
  }).join("");

  const tabs = PARTS.map((p,i)=>{
    let cls = "part-tab";
    if(state.partLocked[i]) cls += " locked";
    if(i===state.currentPart) cls += " current";
    return `<div class="${cls}">${state.partLocked[i]?"✓ ":""}Part ${p.id}</div>`;
  }).join("");

  const qHtml = part.questions.map(q=>renderQuestion(part,q)).join("");

  const isLast = state.currentPart === PARTS.length-1;
  const lockedNow = state.partLocked[state.currentPart];

  app.innerHTML = `
    <span class="eyebrow">${state.studentName}'s exam</span>
    <h1 class="title">${part.title}</h1>
    <p class="subtitle">${part.sub}${part.note ? " — "+part.note : ""}</p>

    <div class="numberline-wrap">
      <div class="numberline">
        ${segs}
        <div class="numberline-marker" style="left:${pct}%;">✎</div>
      </div>
      <div class="numberline-ticks"><span>0</span><span>${TOTAL_QUESTIONS} questions</span></div>
      <div class="part-tabs">${tabs}</div>
    </div>

    <div class="card">
      ${lockedNow ? '<div class="notice">This part is locked — you already submitted it. Use the buttons below to move to the next part.</div>' : ''}
      ${qHtml}
    </div>

    <div class="footer-bar">
      <span class="timer">⏱ <span id="timerDisplay">${formatTime(state.elapsed)}</span></span>
      <div style="display:flex;gap:10px;">
        ${state.currentPart>0 ? `<button class="btn btn-ghost" id="prevPartBtn">← Back to Part ${part.id-1} (view only)</button>` : ''}
        ${!lockedNow
          ? `<button class="btn btn-primary" id="lockPartBtn">${isLast ? "Finish Exam" : "Submit Part "+part.id+" & Continue"}</button>`
          : (isLast
              ? `<button class="btn btn-primary" id="finishBtn">Finish Exam</button>`
              : `<button class="btn btn-primary" id="nextPartBtn">Go to Part ${part.id+1} →</button>`)
        }
      </div>
    </div>
  `;

  part.questions.forEach(q=>attachQuestionHandler(part,q,lockedNow));

  if(document.getElementById("lockPartBtn")){
    document.getElementById("lockPartBtn").onclick = async ()=>{
      const ok = confirm("Submit this part? You won't be able to change these answers afterward.");
      if(!ok) return;
      state.partLocked[state.currentPart] = true;
      await saveProgress();
      if(isLast){ await finishExam(); }
      else { state.currentPart++; render(); }
    };
  }
  if(document.getElementById("nextPartBtn")){
    document.getElementById("nextPartBtn").onclick = ()=>{ state.currentPart++; render(); };
  }
  if(document.getElementById("prevPartBtn")){
    document.getElementById("prevPartBtn").onclick = ()=>{ state.currentPart--; render(); };
  }
  if(document.getElementById("finishBtn")){
    document.getElementById("finishBtn").onclick = async ()=>{ await finishExam(); };
  }
}

function renderQuestion(part,q){
  const key = qKey(part.id,q.n);
  const val = state.answers[key];
  let inputHtml = "";
  if(q.type==="short" || q.type==="range"){
    inputHtml = `<div class="q-input-wrap"><input type="text" data-key="${key}" value="${val!==undefined?escapeHtml(val):""}" placeholder="Your answer"></div>`;
  } else if(q.type==="tf"){
    const labels = q.tfLabels || ["True","False"];
    inputHtml = `<div class="tf-row">
      <label class="tf-opt"><input type="radio" name="${key}" data-key="${key}" value="true" ${val==="true"?"checked":""}> ${labels[0]}</label>
      <label class="tf-opt"><input type="radio" name="${key}" data-key="${key}" value="false" ${val==="false"?"checked":""}> ${labels[1]}</label>
    </div>`;
  } else if(q.type==="manual"){
    inputHtml = `<div class="q-input-wrap"><textarea data-key="${key}" placeholder="Your answer">${val!==undefined?escapeHtml(val):""}</textarea></div>`;
  }
  const manualTag = q.type==="manual" ? '<span class="manual-tag">reviewed by hand</span>' : "";
  return `<div class="q">
    <div class="q-prompt"><span class="q-num">${q.n}.</span>${escapeHtml(q.prompt)}${manualTag}</div>
    ${inputHtml}
  </div>`;
}

function attachQuestionHandler(part,q,locked){
  const key = qKey(part.id,q.n);
  const els = document.querySelectorAll(`[data-key="${key}"]`);
  els.forEach(el=>{
    if(locked){ el.disabled = true; return; }
    const evt = (q.type==="tf") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      state.answers[key] = el.value;
      saveProgress();
      // live-update number line marker without full re-render for smoother feel
      const answered = answeredCount();
      const pct = Math.min(100,(answered/TOTAL_QUESTIONS)*100);
      const marker = document.querySelector(".numberline-marker");
      if(marker) marker.style.left = pct+"%";
    });
  });
}

const FORMSPREE_ENDPOINT = "https://formspree.io/f/mgawapnl";

function buildReviewerEmailText(){
  const now = new Date();
  const graded = gradeAll();
  const summary = autoScoreSummary();
  let lines = [];
  lines.push("MATH FOUNDATIONS EXAM — RESULTS FOR REVIEW");
  lines.push("Student: " + state.studentName);
  lines.push("Time taken: " + formatTime(state.elapsed));
  lines.push("Submitted: " + now.toLocaleString());
  lines.push("");
  lines.push("AUTO-GRADED SCORE: " + summary.overallCorrect + "/" + summary.overallAutoTotal
    + " (" + (summary.overallAutoTotal>0 ? Math.round((summary.overallCorrect/summary.overallAutoTotal)*100) : 0) + "%)");
  lines.push(summary.overallManualPending + " question(s) below are marked [TO SCORE] and need your judgment.");
  lines.push("");

  PARTS.forEach(part=>{
    lines.push("=".repeat(3) + " " + part.title + " " + "=".repeat(3));
    lines.push("");
    part.questions.forEach(q=>{
      const key = qKey(part.id,q.n);
      const given = state.answers[key];
      const answerText = (given===undefined || given.toString().trim()==="") ? "(left blank)" : given;
      const g = graded[key];
      lines.push(q.n + ". " + q.prompt);
      lines.push("   Student answered: " + answerText);
      if(g.type==="auto"){
        if(g.correct){
          lines.push("   ✓ CORRECT");
        } else {
          const correctAnswer = q.type==="range" ? ("between " + q.range[0] + " and " + q.range[1]) : (q.accept ? q.accept[0] : "");
          lines.push("   ✗ WRONG — correct answer: " + correctAnswer);
        }
      } else {
        lines.push("   [TO SCORE — expected: " + q.expected + "]");
      }
      lines.push("");
    });
  });
  return lines.join("\n");
}

function buildAnswersPayload(){
  const now = new Date();
  const graded = gradeAll();
  let lines = [];
  lines.push("MATH FOUNDATIONS EXAM — ANSWERS");
  lines.push("Student: " + state.studentName);
  lines.push("Time taken: " + formatTime(state.elapsed));
  lines.push("Submitted: " + now.toLocaleString());
  lines.push("");

  PARTS.forEach(part=>{
    lines.push("=".repeat(3) + " " + part.title + " " + "=".repeat(3));
    lines.push("");
    part.questions.forEach(q=>{
      const key = qKey(part.id,q.n);
      const given = state.answers[key];
      const answerText = (given===undefined || given.toString().trim()==="") ? "(left blank)" : given;
      lines.push(q.n + ". " + q.prompt);
      lines.push("   Answer: " + answerText);
      lines.push("");
    });
  });

  const dataPayload = {
    kind:"grade1examanswers",
    studentName: state.studentName,
    answers: state.answers,
    autoGraded: graded,
    adminReview:{},
    elapsed: state.elapsed,
    submittedAt: Date.now()
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(dataPayload))));

  const readableText = lines.join("\n")
    + "\n------ DO NOT EDIT BELOW THIS LINE (encoded data, used only for auto-grading import) ------\n"
    + encoded;

  return { readableText, dataPayload };
}

async function sendResultsToReviewer(readableText){
  try{
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({
        student_name: state.studentName,
        _subject: "Math exam results — " + state.studentName,
        message: readableText
      })
    });
    return res.ok;
  }catch(e){
    console.error("Formspree send failed", e);
    return false;
  }
}

async function finishExam(){
  clearInterval(state.timerHandle);
  await submitExam();
  const reviewerText = buildReviewerEmailText();
  state.sendStatus = "sending";
  state.screen = "submitted";
  render();
  const ok = await sendResultsToReviewer(reviewerText);
  state.sendStatus = ok ? "sent" : "failed";
  if(state.screen === "submitted") render();
}

function autoScoreSummary(){
  const graded = gradeAll();
  let overallCorrect=0, overallAutoTotal=0, overallManualPending=0;
  const rows = PARTS.map(part=>{
    let correct=0, autoTotal=0, manualPending=0;
    part.questions.forEach(q=>{
      const g = graded[qKey(part.id,q.n)];
      if(g.type==="auto"){ autoTotal++; if(g.correct) correct++; }
      else { manualPending++; }
    });
    overallCorrect += correct; overallAutoTotal += autoTotal; overallManualPending += manualPending;
    const pct = autoTotal>0 ? Math.round((correct/autoTotal)*100) : null;
    return {title:part.title, correct, autoTotal, manualPending, pct};
  });
  return {rows, overallCorrect, overallAutoTotal, overallManualPending};
}

function renderSubmitted(){
  const summary = autoScoreSummary();
  const overallPct = summary.overallAutoTotal>0 ? Math.round((summary.overallCorrect/summary.overallAutoTotal)*100) : 0;
  const rowsHtml = summary.rows.map(r=>{
    const pctColor = r.pct===null ? 'var(--ink-soft)' : (r.pct>=70 ? 'var(--green)' : 'var(--coral)');
    return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--paper-line);font-size:14px;">
      <span>${escapeHtml(r.title)}</span>
      <span style="font-family:'JetBrains Mono',monospace;color:${pctColor};font-weight:600;">
        ${r.autoTotal>0 ? r.correct+"/"+r.autoTotal : "—"} ${r.manualPending>0 ? `<span class="manual-tag">${r.manualPending} hand-graded</span>` : ""}
      </span>
    </div>`;
  }).join("");

  let sendStatusHtml;
  if(state.sendStatus==="sending"){
    sendStatusHtml = `<div class="notice" style="background:var(--indigo-soft);border-color:#C7CCEA;color:var(--indigo);">Sending your results to be reviewed…</div>`;
  } else if(state.sendStatus==="sent"){
    sendStatusHtml = `<div class="notice" style="background:var(--green-soft);border-color:#BFDCC4;color:var(--green);">✓ Your results were sent automatically. You don't need to do anything else — but downloading a copy below never hurts.</div>`;
  } else if(state.sendStatus==="failed"){
    sendStatusHtml = `<div class="notice">⚠ Couldn't send automatically (maybe no internet connection). Please download your answers below and pass the file along yourself.</div>`;
  } else {
    sendStatusHtml = "";
  }

  app.innerHTML = `
    <span class="eyebrow">All done</span>
    <h1 class="title">Nice work, ${escapeHtml(state.studentName)}.</h1>
    <p class="subtitle">Here's your score on the questions that grade automatically. ${summary.overallManualPending} question${summary.overallManualPending===1?'':'s'} will be scored by hand by whoever's reviewing your exam — that's normal, not a mistake, so your final result may shift slightly once those are checked.</p>
    ${sendStatusHtml}

    <div class="card">
      <div style="text-align:center;margin-bottom:14px;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;color:var(--indigo);">${summary.overallCorrect}/${summary.overallAutoTotal}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);">auto-graded correct (${overallPct}%)</div>
      </div>
      ${rowsHtml}
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);">Time taken: ${formatTime(state.elapsed)}</div>
      <p style="font-size:13px;color:var(--ink-soft);margin:10px 0 4px 0;">Want a backup copy too? Download your answers as a file.</p>
      <button class="btn btn-primary" id="downloadBtn" style="margin-top:8px;">⬇ Download my answers (readable)</button>
      <div><button class="btn btn-ghost" id="backToLanding" style="margin-top:12px;">Back to start</button></div>
    </div>
  `;
  document.getElementById("downloadBtn").onclick = downloadAnswers;
  document.getElementById("backToLanding").onclick = ()=>{ state.screen="landing"; render(); };
}

function downloadAnswers(){
  const { readableText } = buildAnswersPayload();
  const blob = new Blob([readableText], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = state.studentName.toLowerCase().replace(/[^a-z0-9]/g,"_")+"_math_exam_answers.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  app.innerHTML = `
    <span class="eyebrow">Reviewer view</span>
    <h1 class="title">This section is for whoever's grading the exam.</h1>
    <p class="subtitle">Not a real login — just a soft speed bump so it isn't the first thing a sister taps into.</p>
    <div class="card">
      <button class="btn btn-primary" id="enterReview">Continue to results</button>

  `;
  document.getElementById("enterReview").onclick = async ()=>{ state.screen="review"; render(); };
  document.getElementById("backLink").onclick = ()=>{ state.screen="landing"; render(); };

async function renderReview(){
  const keysRes = await window.storage.list("examSubmission:", false);
  const keys = keysRes && keysRes.keys ? keysRes.keys : [];
  if(keys.length===0){
    app.innerHTML = `
      <span class="eyebrow">Reviewer view</span>
      <h1 class="title">No submissions yet</h1>
      <p class="subtitle">Once someone finishes the exam, their results will show up here.</p>
      <div class="card"><button class="btn btn-ghost" id="backLink">Back</button></div>
    `;
    document.getElementById("backLink").onclick = ()=>{ state.screen="landing"; render(); };
    return;
  }
  const submissions = [];
  for(const k of keys){
    const res = await window.storage.get(k, false);
    if(res) submissions.push(JSON.parse(res.value));
  }
  state.reviewSubmissions = submissions;

  const cards = submissions.map((sub,idx)=>renderSubmissionCard(sub,idx)).join("");

  app.innerHTML = `
    <span class="back-link" id="backLink">← Back to start</span>
    <span class="eyebrow">Reviewer view</span>
    <h1 class="title">Results</h1>
    <p class="subtitle">Auto-graded where possible. Items tagged "reviewed by hand" need your judgment — mark them correct or not, and the totals update live.</p>

    <div class="card">
      <h3 style="font-size:15px;">Import an answers file</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:6px 0 12px 0;">If someone downloaded their "..._math_exam_answers.txt" file instead of finishing on this exact device, load it here.</p>
      <input type="file" id="importFile" accept=".txt,.json" multiple>
    </div>

    ${cards}
  `;
  document.getElementById("backLink").onclick = ()=>{ state.screen="landing"; render(); };
  document.getElementById("importFile").addEventListener("change", handleImportFiles);

  submissions.forEach((sub,idx)=>attachReviewHandlers(sub,idx));
}

async function handleImportFiles(e){
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const text = await file.text();
      let jsonText = text;
      const marker = "DO NOT EDIT BELOW THIS LINE";
      const idx = text.indexOf(marker);
      if(idx !== -1){
        const afterMarker = text.slice(idx);
        const newlineIdx = afterMarker.indexOf("\n");
        const encoded = afterMarker.slice(newlineIdx+1).trim();
        jsonText = decodeURIComponent(escape(atob(encoded)));
      }
      const data = JSON.parse(jsonText);
      if(data.kind!=="grade1examanswers" || !data.studentName){ continue; }
      await window.storage.set("examSubmission:"+data.studentName.toLowerCase(), JSON.stringify(data));
    }catch(err){ console.error("Could not import file", file.name, err); }
  }
  render();
}

function renderSubmissionCard(sub, idx){
  const adminReview = sub.adminReview || {};
  let overallCorrect=0, overallTotal=0;
  const partBlocks = PARTS.map(part=>{
    const sc = partScore(part, sub.autoGraded, adminReview);
    overallCorrect += sc.correct; overallTotal += sc.total;
    const pct = Math.round((sc.correct/sc.total)*100);
    const isDiagnostic = !!part.diagnostic;
    const passed = isDiagnostic ? null : (sc.correct/sc.total) >= PART_PASS_PCT;
    const qRows = part.questions.map(q=>{
      const key = qKey(part.id,q.n);
      const given = sub.answers[key] || "(blank)";
      const g = sub.autoGraded[key];
      let markup;
      if(g.type==="auto"){
        markup = `<span style="color:${g.correct?'var(--green)':'var(--coral)'};font-weight:600;">${g.correct?'✓':'✗'}</span>`;
      } else {
        const cur = adminReview[key];
        markup = `<div class="mark-btns">
          <button class="mark-btn ${cur==='correct'?'active-correct':''}" data-review="${idx}:${key}:correct">✓ correct</button>
          <button class="mark-btn ${cur==='wrong'?'active-wrong':''}" data-review="${idx}:${key}:wrong">✗ wrong</button>
        </div>`;
      }
      return `<div class="review-q">
        <div style="flex:1;">
          <div class="given"><b>${q.n}.</b> ${escapeHtml(given)}</div>
          ${q.type==='manual' ? `<div class="expected">expected: ${escapeHtml(q.expected)}</div>` : ''}
        </div>
        ${markup}
      </div>`;
    }).join("");
    return `<details style="margin-top:10px;">
      <summary style="cursor:pointer;font-weight:600;font-size:14px;">
        ${part.title} — ${sc.correct}/${sc.total} (${pct}%)
        ${passed===null ? '' : `<span class="pass-pill ${passed?'pass-yes':'pass-no'}" style="margin-left:8px;">${passed?'PASS':'REPEAT'}</span>`}
        ${sc.manualPending>0 ? `<span class="manual-tag">${sc.manualPending} to review</span>` : ''}
      </summary>
      <div style="margin-top:8px;">${qRows}</div>
    </details>`;
  }).join("");

  const overallPct = Math.round((overallCorrect/overallTotal)*100);
  const overallPass = (overallCorrect/overallTotal) >= OVERALL_PASS_PCT;

  return `<div class="card" data-submission-idx="${idx}">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:19px;text-transform:capitalize;">${escapeHtml(sub.studentName)}</h2>
      <span class="pass-pill ${overallPass?'pass-yes':'pass-no'}">${overallPct}% overall — ${overallPass?'PASS':'NOT YET'}</span>
    </div>
    <div class="review-summary">
      <div class="stat-box"><div class="num">${overallCorrect}/${overallTotal}</div><div class="lbl">total correct</div></div>
      <div class="stat-box"><div class="num">${formatTime(sub.elapsed||0)}</div><div class="lbl">time taken</div></div>
    </div>
    ${partBlocks}
  </div>`;
}

function attachReviewHandlers(sub, idx){
  const card = document.querySelector(`[data-submission-idx="${idx}"]`);
  if(!card) return;
  card.querySelectorAll("[data-review]").forEach(btn=>{
    btn.onclick = async ()=>{
      const [subIdx, key, mark] = btn.getAttribute("data-review").split(":");
      const submission = state.reviewSubmissions[parseInt(subIdx,10)];
      submission.adminReview = submission.adminReview || {};
      // toggle off if clicking same mark again
      submission.adminReview[key] = submission.adminReview[key]===mark ? undefined : mark;
      await window.storage.set("examSubmission:"+submission.studentName.toLowerCase(), JSON.stringify(submission), false);
      render(); // re-render review to recompute totals
    };
  });
}

function escapeHtml(s){
  return (s===undefined||s===null?"":s.toString())
